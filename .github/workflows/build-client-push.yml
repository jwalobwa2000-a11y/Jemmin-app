name: Build Jemmin Client APK with notifications
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Firebase file
        run: |
          rm -f gs.json
          for f in google-services*.json; do
            if [ -f "$f" ] && grep -q com.jemmin.client "$f" && grep -q com.jemmin.cleaner "$f" && grep -q com.jemmin.admin "$f"; then cp "$f" gs.json; fi
          done
          if [ ! -f gs.json ]; then echo "No usable google-services.json in this repository. It must be the file downloaded from Firebase AFTER adding all 3 apps (client, cleaner, admin)."; exit 1; fi
      - name: Arrange files and create settings
        run: |
          mkdir -p www assets
          h=$(ls -t jemmin-client-push*.html | head -1)
          mv "$h" www/index.html
          mv icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
          cat > package.json <<'JSON'
          {
            "name": "jemmin-client",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/push-notifications": "^7.0.0",
              "jsqr": "^1.4.0"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.jemmin.client",
            "appName": "Jemmin",
            "webDir": "www",
            "backgroundColor": "#0B5CFF"
          }
          JSON
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: |
          npm install
          cp node_modules/jsqr/dist/jsQR.js www/jsQR.js
      - name: Create the Android project
        run: npx cap add android
      - name: Allow the camera (for scanning the cleaner QR code)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$f"
          grep -c "android.permission.CAMERA" "$f"
      - name: Allow location (to find cleaners nearby and show the cleaner on the way)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application|' "$f"
          grep -c "ACCESS_FINE_LOCATION" "$f"
      - name: Make app icon and launch screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
      - name: Add notifications to the Android project
        run: |
          cp gs.json android/app/google-services.json
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><application#' "$f"
          grep -c POST_NOTIFICATIONS "$f"
          ls android/app/google-services.json
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jemmin-client-push-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
