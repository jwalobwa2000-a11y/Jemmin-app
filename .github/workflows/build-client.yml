name: Build Jemmin Client APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files and create settings
        run: |
          mkdir -p www assets
          f=jemmin-client.html
          [ -f "$f" ] || f=$(ls jemmin-client*.html | head -1)
          mv "$f" www/index.html
          mv icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
          cat > package.json <<'JSON'
          {
            "name": "jemmin-client",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "jsqr": "^1.4.0"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.jemmin.client",
            "appName": "Jemmin",
            "webDir": "www",
            "backgroundColor": "#0B5CFF"
          }
          JSON
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: |
          npm install
          cp node_modules/jsqr/dist/jsQR.js www/jsQR.js
      - name: Create the Android project
        run: npx cap add android
      - name: Allow the camera (for scanning the cleaner QR code)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$f"
          grep -c "android.permission.CAMERA" "$f"
      - name: Make app icon and launch screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jemmin-client-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
