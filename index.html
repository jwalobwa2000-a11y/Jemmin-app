<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B5CFF">
<style>:root{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);color-scheme:light}[hidden]{display:none!important}</style>
<title>Jemmin Cleaning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-width column (max 480px), sticky top bars, bottom tab bar, bottom sheets for booking and details, floating support chat. */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#EEF1F7; --fg:#0E1729; --muted:#5A6780; --line:#E3E8F1;
  --brand:#0B5CFF; --brand-ink:#FFFFFF; --brand-soft:#E7EFFF; --brand-text:#0A4FDB;
  --hero-a:#0B5CFF; --hero-b:#0840B8; --on-hero:#FFFFFF; --on-hero-soft:rgba(255,255,255,.84);
  --ok:#12875A; --ok-soft:#E1F5EC; --warn:#935A00; --warn-soft:#FFF1D6; --bad:#C93A3A; --bad-soft:#FDE8E8;
  --amber-soft:#FFF1CC; --amber-ink:#7A5200; --star:#F2A900;
  --logo-bg:#FFFFFF; --logo-ink:#111111; --logo-accent:#B8671F;
  --shadow:0 1px 2px rgba(14,23,41,.06),0 8px 20px rgba(14,23,41,.06);
  --frame:#DCE2EE;
  --f-display:'Plus Jakarta Sans',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif; --f-serif:'EB Garamond',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1120; --surface:#121B2E; --surface-2:#1A2540; --fg:#E9EEF8; --muted:#97A4BD; --line:#22304B;
    --brand:#4B8BFF; --brand-ink:#04112B; --brand-soft:#14264D; --brand-text:#86B1FF;
    --hero-a:#1D55D6; --hero-b:#0C2C7A;
    --ok:#3FCB8F; --ok-soft:#11301F; --warn:#F0B24A; --warn-soft:#3A2A08; --bad:#FF7A7A; --bad-soft:#3A1717;
    --amber-soft:#3A2C0A; --amber-ink:#F5C45A; --star:#F5B50F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3);
    --frame:#060B16; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1120; --surface:#121B2E; --surface-2:#1A2540; --fg:#E9EEF8; --muted:#97A4BD; --line:#22304B;
  --brand:#4B8BFF; --brand-ink:#04112B; --brand-soft:#14264D; --brand-text:#86B1FF;
  --hero-a:#1D55D6; --hero-b:#0C2C7A;
  --ok:#3FCB8F; --ok-soft:#11301F; --warn:#F0B24A; --warn-soft:#3A2A08; --bad:#FF7A7A; --bad-soft:#3A1717;
  --amber-soft:#3A2C0A; --amber-ink:#F5C45A; --star:#F5B50F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3);
  --frame:#060B16; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--fg);font:400 14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(0,0,0,.2)}}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.page{padding:16px;display:flex;flex-direction:column;gap:20px;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:12px;font:700 20px/1.2 var(--f-display);letter-spacing:-.01em}
.topbar .grow{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--fg)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-text)}

/* tab bar */
#tabbar{display:flex;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border:0;background:none;color:var(--muted);font:500 12px var(--f-body);border-radius:14px}
.tab[aria-current="page"]{color:var(--brand-text);background:var(--brand-soft)}
#app.no-tabs #tabbar{display:none}
#fab{position:absolute;right:16px;bottom:84px;z-index:20;width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(11,92,255,.38)}
#fab .ic{width:26px;height:26px}
#app.no-tabs #fab{bottom:20px}
#app.no-fab #fab{display:none}

/* hero */
.hero{background:linear-gradient(165deg,var(--hero-a),var(--hero-b));color:var(--on-hero);padding:26px 16px 52px;border-radius:0 0 34px 34px;display:flex;flex-direction:column;gap:16px;align-items:center}
.logo{display:block;background:var(--logo-bg);border-radius:22px;padding:14px 18px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.logo img{display:block;width:230px;max-width:62vw;height:auto}
.logo.sm img{width:200px}
.tagline{font:600 15px var(--f-body);letter-spacing:.1em;text-align:center}
.hero-row{width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.hero-row .hi{color:var(--on-hero-soft);font-size:15px}
.hero h1{font:800 27px/1.1 var(--f-display);letter-spacing:-.02em}
.signin{display:flex;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.18);color:var(--on-hero);border-radius:16px;padding:0 16px;min-height:48px;font:600 16px var(--f-body);white-space:nowrap}
.searchbox{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--muted);border-radius:16px;padding:0 16px;min-height:54px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;color:var(--fg)}
.searchbox input::placeholder{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-34px}
.stat{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.stat .ic{color:var(--brand-text);width:24px;height:24px}
.stat b{font:700 15px/1.2 var(--f-display)}
.stat span{color:var(--muted);font-size:13px}

/* shared */
.sect-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sect-head h2{font:700 22px/1.2 var(--f-display);letter-spacing:-.01em}
.link{border:0;background:none;color:var(--brand-text);font:600 15px var(--f-body);display:flex;align-items:center;gap:2px;padding:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font:600 12.5px/1.3 var(--f-body);background:var(--brand-soft);color:var(--brand-text);white-space:nowrap}
.pill .ic{width:15px;height:15px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.amber{background:var(--amber-soft);color:var(--amber-ink)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font:600 16px var(--f-body)}
.btn:active{filter:brightness(.94)}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed}
.btn.soft{background:var(--brand-soft);color:var(--brand-text)}
.btn.line{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px;padding:0 16px;width:auto}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.err{color:var(--bad);font-size:13px;font-weight:500}
.empty{text-align:center;color:var(--muted);padding:36px 20px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--fg);font:700 17px var(--f-display)}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:16px;padding:4px}
.seg button{flex:1;min-height:46px;border:0;border-radius:12px;background:transparent;color:var(--muted);font:600 16px var(--f-body);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.blue button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 15px var(--f-body);color:var(--fg)}
.chip[aria-pressed="true"],.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}

/* packages */
.pkg{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.pkg-icon{width:52px;height:52px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.pkg-icon.amber{background:#F2B01E;color:#2B1D00}
.pkg h3{font:700 17px/1.25 var(--f-display)}
.price{font:700 16px var(--f-display);color:var(--brand-text);font-variant-numeric:tabular-nums}
.acc-head{display:flex;gap:14px;align-items:flex-start;width:100%;padding:16px;border:0;background:none;text-align:left}
.acc-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h4{margin:0;font:700 16px var(--f-display)}
.grp h4 small{font:600 12px var(--f-body);background:var(--surface-2);color:var(--muted);padding:3px 9px;border-radius:999px;margin-left:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px}
.item .ico{width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;flex:none}
.item b{display:block;font:600 14.5px var(--f-body)}
.item span{color:var(--muted);font-size:13px}
.item .tick{color:var(--brand-text);margin-left:auto;flex:none}
table.cmp{width:100%;border-collapse:collapse}
table.cmp td{padding:14px 0;border-top:1px solid var(--line);font-size:15px}
table.cmp tr:first-child td{border-top:0}
table.cmp td:last-child{text-align:right}

/* cleaners */
.cleaner{padding:16px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;text-align:left;width:100%}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);border:2px solid color-mix(in srgb,var(--brand) 25%,transparent);display:grid;place-items:center;font:700 19px var(--f-display);flex:none;position:relative}
.avatar.lg{width:84px;height:84px;font-size:26px}
.dot{position:absolute;left:4px;bottom:-14px;width:14px;height:14px;border-radius:50%;background:#23A66B;box-shadow:0 0 0 3px var(--surface)}
.cleaner .name{font:700 18px/1.2 var(--f-display);display:flex;align-items:center;gap:6px}
.cleaner .name .ic{color:var(--brand-text);width:18px;height:18px}
.meta{display:flex;gap:14px;color:var(--muted);align-items:center;margin-top:4px}
.meta span{display:inline-flex;gap:5px;align-items:center}
.meta .ic{width:16px;height:16px}
.star{color:var(--star)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;background:var(--surface)}
.tag.km{background:var(--brand-soft);border-color:transparent;color:var(--brand-text);font-weight:600}
.rate{text-align:right;flex:none}
.rate b{display:block;font:700 18px var(--f-display);color:var(--brand-text);font-variant-numeric:tabular-nums}
.rate span{color:var(--muted);font-size:13px}

/* jobs */
.job{padding:16px;display:flex;flex-direction:column;gap:12px}
.job h3{font:700 19px/1.2 var(--f-display)}
.job .foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.job .foot .price{font-size:19px;margin-right:auto}
.note{background:var(--brand-soft);color:var(--brand-text);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.note button{margin-left:auto;border:0;background:none;color:inherit;padding:0 2px}

/* form */
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.lbl{font:600 15px var(--f-body)}
.input{width:100%;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:16px;outline:0}
textarea.input{padding:12px 14px;min-height:80px;resize:vertical}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.input-ic{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 16px;min-height:58px;color:var(--muted)}
.input-ic input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:19px;color:var(--fg)}
.input-ic:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.hint{color:var(--muted);font-size:14px}
.otp{letter-spacing:.9em;text-align:center;font:700 30px var(--f-display);padding-left:.9em}

/* terms */
.t-icon{width:84px;height:84px;color:var(--brand-text);align-self:center}
.clause{padding:16px;display:flex;flex-direction:column;gap:12px}
.clause .head{display:flex;align-items:center;gap:12px}
.clause .head .ico{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;flex:none}
.clause h3{font:700 19px/1.2 var(--f-display)}
.clause ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.clause li{display:flex;gap:12px;color:var(--muted);font-size:15.5px;line-height:1.5}
.clause li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-top:9px}

/* profile */
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:14px;padding:16px;border:0;background:none;text-align:left;border-top:1px solid var(--line);font:500 16px var(--f-body)}
.menu button:first-child{border-top:0}
.menu .ic:last-child{margin-left:auto;color:var(--muted)}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-end}
.scrim{position:absolute;inset:0;background:rgba(6,12,26,.55)}
#sheet{position:relative;width:100%;max-width:480px;max-height:92%;background:var(--surface);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;outline:0}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:12px;padding:10px 16px 8px}
.sheet-head h2{font:700 20px/1.2 var(--f-display);flex:1;min-width:0}
.sheet-body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:18px;min-height:0}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.steps{display:flex;gap:6px;padding:0 16px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--brand)}
.opt{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.opt[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt b{display:block;font:600 15.5px var(--f-body)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-left:auto;display:grid;place-items:center}
.opt[aria-checked="true"] .radio{border-color:var(--brand);background:radial-gradient(circle,var(--brand) 45%,transparent 50%)}
.sum{display:flex;flex-direction:column}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.sum div:first-child{border-top:0}
.sum span:first-child{color:var(--muted)}
.sum span:last-child{text-align:right;font-weight:600}
.sum .total span:last-child{font:700 18px var(--f-display);color:var(--brand-text)}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:14px;align-items:flex-start;padding-bottom:16px;position:relative}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .pt{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--brand-ink)}
.tl.done .pt{background:var(--brand);border-color:var(--brand)}
.tl.done::before{background:var(--brand)}
.tl.now .pt{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
.tl .pt .ic{width:14px;height:14px}
.tl b{font:600 15px var(--f-body)}
.tl.todo b{color:var(--muted);font-weight:500}
.track{position:relative;height:8px;border-radius:4px;background:var(--surface-2);margin:10px 0 6px}
.track i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--brand)}
.track u{position:absolute;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 25%,transparent);margin-left:-10px}
.gate{font:800 44px/1 var(--f-display);letter-spacing:.14em;text-align:center;padding:22px 0 22px .14em;background:var(--brand-soft);color:var(--brand-text);border-radius:18px;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;padding:2px;color:var(--line)}
.stars button.on{color:var(--star)}
.stars .ic{width:34px;height:34px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .9s linear infinite;margin:6px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 4px}
.center h3{font:700 20px var(--f-display)}
.big-check{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.big-check .ic{width:34px;height:34px}

/* chat */
.thread-row{display:flex;gap:14px;align-items:center;padding:14px 16px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}
.thread-row:first-child{border-top:0}
.thread-row .avatar{width:50px;height:50px;font-size:16px}
.thread-row b{font:600 16px var(--f-body);display:block}
.thread-row span.l{color:var(--muted);font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;padding:11px 14px;border-radius:18px;background:var(--surface-2);font-size:15.5px;line-height:1.5;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:6px}
.bub.them{border-bottom-left-radius:6px}
.bub.typing{display:flex;gap:4px;padding:14px}
.bub.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.bub.typing i:nth-child(2){animation-delay:.15s}.bub.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.composer{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.composer input{flex:1;min-width:0;min-height:50px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:16px;outline:0}
.composer input:focus{border-color:var(--brand)}
.composer button{width:56px;min-height:50px;border-radius:16px;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.thread{display:flex;flex-direction:column;height:100%}
#botWrap{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:center;padding:16px}
#bot{position:relative;width:100%;max-width:448px;height:min(80%,660px);background:var(--surface);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:up .22s ease-out}
.bot-head{background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:14px;padding:18px 16px}
.bot-head .av{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.bot-head b{display:block;font:700 19px var(--f-display)}
.bot-head span{font-size:14px;opacity:.85}
.bot-head .iconbtn{color:inherit}
.qr{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start}
.qr button{border:1px solid var(--brand);background:var(--surface);color:var(--brand-text);border-radius:999px;padding:8px 14px;font:500 14px var(--f-body)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font:500 14.5px var(--f-body);max-width:min(440px,calc(100% - 32px));box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <main id="screen" aria-live="polite"></main>
  <nav id="tabbar" aria-label="Main"></nav>
  <button id="fab" data-a="botOpen" aria-label="Open support chat"></button>
</div>
<div id="sheetWrap" hidden><div class="scrim" data-a="sheetClose"></div><div id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div id="botWrap" hidden><div class="scrim" data-a="botClose"></div><section id="bot" role="dialog" aria-modal="true" aria-label="Jemmin Support chat"></section></div>
<div id="toast" hidden></div>

/* ---------- formatting ---------- */
const pad=n=>String(n).padStart(2,'0');
function timeStr(d){let h=d.getHours();const m=pad(d.getMinutes());const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${m} ${ap}`}
function dayDiff(d){const a=new Date();a.setHours(0,0,0,0);const b=new Date(d);b.setHours(0,0,0,0);return Math.round((b-a)/864e5)}
function fmtWhen(iso){const d=new Date(iso);const n=dayDiff(d);let day;
 if(n===0)day='Today';else if(n===1)day='Tomorrow';else if(n===-1)day='Yesterday';
 else day=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
 return `${day}, ${timeStr(d)}`}
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function fmtPhone(p){return p.replace(/^(\d{4})(\d{3})(\d{3})$/,'$1 $2 $3')}
function normPhone(v){const s=String(v).replace(/[\s-]/g,'');const m=s.match(/^(?:\+?254|0)([71]\d{8})$/);return m?'0'+m[1]:null}
const gateCode=id=>{let h=7;for(const c of id)h=(h*31+c.charCodeAt(0))%900000;return String(100000+h)};
function calc(sid,size,rate){const s=svc(sid);if(!s||!s.hours)return 0;const z=SIZES.find(x=>x.id===size)||SIZES[0];return Math.round(rate*s.hours*z.f/50)*50}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},2800)}

function detailSheet(id){
 const j=S.jobs.find(x=>x.id===id);if(!j)return;const c=cl(j.cid);const st=STATUS[j.status];
 const idx=Math.max(0,FLOW.indexOf(j.status));const cancelled=j.status==='cancelled';const quote=j.status==='quote';
 const live=['accepted','enroute','progress'].includes(j.status);
 const tl=(quote||cancelled)?'':`<div class="timeline">${STEPS.map((s,i)=>`<div class="tl ${i<idx||j.status==='done'?'done':i===idx?'now':'todo'}"><span class="pt">${i<idx||j.status==='done'?ic('check'):''}</span><div><b>${s}</b></div></div>`).join('')}</div>`;
 const eta=j.status==='enroute'?`<div class="card" style="padding:14px"><div class="row"><b>${esc(c?c.name.split(' ')[0]:'Your cleaner')} is on the way</b><span class="pill grow-0" style="margin-left:auto">~12 min</span></div><div class="track"><i style="width:62%"></i><u style="left:62%"></u></div><div class="row muted small" style="justify-content:space-between"><span>Left home</span><span>Your place</span></div></div>`:'';
 const rate=j.status==='done'?`<div class="stack"><b>${j.rating?'Your rating':'Rate your cleaner'}</b><div class="stars" role="group" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button class="${(j.rating||0)>=n?'on':''}" data-a="rate" data-v="${j.id}" data-n="${n}" aria-label="${n} star${n>1?'s':''}">${ic('starF')}</button>`).join('')}</div></div>`:'';
 const confirming=S.cancelAsk===j.id;
 const foot=[
  live?`<button class="btn" data-a="gate" data-v="${j.id}">${ic('lock')} Gate Pass</button>`:'',
  c&&!cancelled?`<button class="btn line" data-a="thread" data-v="${c.id}">${ic('chat')} Message ${esc(c.name.split(' ')[0])}</button>`:'',
  ['searching','accepted','quote'].includes(j.status)?(confirming?`<p class="err" style="text-align:center">Cancel this booking? Part of the deposit may be kept if a cleaner already accepted.</p><div class="row"><button class="btn line" data-a="cancelNo">Keep booking</button><button class="btn danger" data-a="cancelYes" data-v="${j.id}">Yes, cancel</button></div>`:`<button class="btn danger" data-a="cancelAsk" data-v="${j.id}">Cancel booking</button>`):'',
  (!j.sample&&FLOW.includes(j.status)&&j.status!=='done')?`<button class="btn soft sm" style="align-self:center" data-a="advance" data-v="${j.id}">Demo: move to next step</button>`:''
 ].join('');
 setSheet(()=>sheetShell(esc(j.service),`<div class="sheet-body">
  <div class="row"><span class="pill ${st.c}">${ic(st.i)}${st.l}</span>${j.sample?'<span class="pill plain">Sample job</span>':''}</div>${eta}${tl}${rate}
  <div class="sum"><div><span>Cleaner</span><span>${c?esc(c.name):'Matching…'}</span></div><div><span>When</span><span>${fmtWhen(j.when)}</span></div><div><span>Where</span><span>${esc(j.addr||j.area)}</span></div>
   <div class="total"><span>Total</span><span>${j.price?KES(j.price):'Custom quote'}</span></div>
   ${j.price?`<div><span>Deposit paid (50%)</span><span>${KES(j.deposit)}</span></div><div><span>Balance after the job</span><span>${KES(j.price-j.deposit)}</span></div>`:''}</div></div>`,foot));
}

function startBooking(o={}){
 if(!S.user){S.pending=o;S.after=null;nav('signin');toast('Sign in to book a cleaner');return}
 const u=S.user;
 S.b={step:1,service:o.service||'regular',size:'s',when:'asap',custom:'',area:u.area||'Westlands',addr:u.addr||'',notes:'',cleaner:o.cleaner||null,phone:u.phone||'',pay:'idle',err:'',job:null};
 setSheet(bookingView);
}
function minTime(){return new Date(Date.now()+2*36e5+6e4)}
function whenISO(b){
 if(b.when==='tomorrow'){const d=new Date();d.setDate(d.getDate()+1);d.setHours(9,0,0,0);return d.toISOString()}
 if(b.when==='custom')return b.custom?new Date(b.custom).toISOString():'';
 const d=minTime();d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);return d.toISOString();
}
function localInput(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function bookingView(){
 const b=S.b;const s=svc(b.service);const special=b.service==='special';
 const rate=b.cleaner?cl(b.cleaner).rate:500;const total=calc(b.service,b.size,rate);const dep=total/2;
 const iso=whenISO(b);
 const bar=`<div class="steps">${[1,2,3].map(n=>`<i class="${n<=b.step?'on':''}"></i>`).join('')}</div>`;
 if(b.pay==='done'){
  return sheetShell('Booking confirmed',`<div class="sheet-body"><div class="center"><span class="big-check">${ic('check')}</span><h3>${special?'Quote requested':'You are booked'}</h3>
   <p class="muted">${special?'A Jemmin agent will prepare your custom quote.':`We are matching ${b.cleaner?esc(cl(b.cleaner).name):'the nearest available cleaner'} to your job. You can follow progress in My Jobs.`}</p></div></div>`,
   `<button class="btn" data-a="viewJob" data-v="${b.job}">View my job</button><button class="btn line" data-a="sheetClose">Done</button>`);
 }
 if(b.pay==='waiting'){
  return sheetShell('M-Pesa payment',`<div class="sheet-body"><div class="center"><div class="spin"></div><h3>Check your phone</h3><p class="muted">Enter your M-Pesa PIN to pay the ${KES(dep)} deposit.</p><span class="pill plain">Prototype: payment is simulated</span></div></div>`);
 }
 let body='',foot='';
 if(b.step===1){
  body=`<div class="sheet-body">
   <div class="field"><span class="lbl">Service</span><div class="stack" style="gap:8px" role="radiogroup" aria-label="Service">${SERVICES.map(x=>`<button class="opt" role="radio" aria-checked="${b.service===x.id}" data-a="bSvc" data-v="${x.id}"><div class="grow"><b>${x.name}</b><span class="muted small">${x.blurb}</span></div><span class="price" style="font-size:14px;white-space:nowrap">${x.from}</span></button>`).join('')}</div></div>
   ${special?'':`<div class="field"><span class="lbl">Home size</span><div class="chips wrap">${SIZES.map(z=>`<button class="chip" aria-pressed="${b.size===z.id}" data-a="bSize" data-v="${z.id}">${z.name}</button>`).join('')}</div></div>`}
   <div class="field"><span class="lbl">When</span><div class="chips wrap"><button class="chip" aria-pressed="${b.when==='asap'}" data-a="bWhen" data-v="asap">Earliest (in 2 hrs)</button><button class="chip" aria-pressed="${b.when==='tomorrow'}" data-a="bWhen" data-v="tomorrow">Tomorrow 9:00 AM</button><button class="chip" aria-pressed="${b.when==='custom'}" data-a="bWhen" data-v="custom">Pick a time</button></div>
    ${b.when==='custom'?`<input class="input" type="datetime-local" id="bCustom" data-k="bCustom" min="${localInput(minTime())}" value="${esc(b.custom)}" aria-label="Date and time">`:''}
    ${iso?`<p class="muted small">${ic('cal')} ${fmtWhen(iso)}</p>`:''}</div>
   <div class="field"><label for="bArea">Area in Nairobi</label><select class="input" id="bArea" data-k="bArea">${AREAS.map(a=>`<option ${a===b.area?'selected':''}>${a}</option>`).join('')}</select></div>
   <div class="field"><label for="bAddr">Estate / building and house number</label><input class="input" id="bAddr" data-k="bAddr" value="${esc(b.addr)}" placeholder="e.g. Rose Apartments, B4" autocomplete="street-address"></div>
   <div class="field"><label for="bNotes">Notes for the cleaner <span class="muted" style="font-weight:400">(optional)</span></label><textarea class="input" id="bNotes" data-k="bNotes" placeholder="Gate code, pets, what to focus on">${esc(b.notes)}</textarea></div>
   ${b.err?`<p class="err">${esc(b.err)}</p>`:''}</div>`;
  foot=`<div class="row" style="justify-content:space-between"><span class="muted">${special?'Price':'Estimated total'}</span><span class="price" style="font-size:20px">${special?'Custom quote':KES(total)}</span></div><button class="btn" data-a="bNext">${special?'Continue':'Choose cleaner'}</button>`;
 }
 if(b.step===2){
  body=`<div class="sheet-body"><p class="muted">Pick a cleaner or let us match the nearest one who is online.</p>
   <button class="opt" role="radio" aria-checked="${!b.cleaner}" data-a="bClean" data-v=""><span class="pkg-icon" style="width:44px;height:44px;border-radius:12px">${ic('pin')}</span><div class="grow"><b>Nearest available</b><span class="muted small">Fastest match, usually a few minutes</span></div><span class="price" style="font-size:14px">${special?'':KES(calc(b.service,b.size,500))}</span></button>
   ${CLEANERS.map(c=>`<button class="opt" role="radio" aria-checked="${b.cleaner===c.id}" data-a="bClean" data-v="${c.id}"><span class="avatar" style="width:44px;height:44px;font-size:14px;border-width:1px">${c.ini}</span><div class="grow"><b>${esc(c.name)}</b><span class="muted small"><span class="star">★</span> ${c.rating} · ${c.km} km · ${c.online?'Online':'Offline'}</span></div><span class="price" style="font-size:14px">${special?KES(c.rate)+'/hr':KES(calc(b.service,b.size,c.rate))}</span></button>`).join('')}</div>`;
  foot=`<div class="row"><button class="btn line" data-a="bBack" style="width:auto;padding:0 22px">Back</button><button class="btn" data-a="bNext">${special?'Review request':'Review and pay'}</button></div>`;
 }
 if(b.step===3){
  const cn=b.cleaner?cl(b.cleaner).name:'Nearest available';
  body=`<div class="sheet-body"><div class="sum"><div><span>Service</span><span>${esc(s.name)}</span></div>${special?'':`<div><span>Home size</span><span>${esc(SIZES.find(z=>z.id===b.size).name)}</span></div>`}<div><span>Cleaner</span><span>${esc(cn)}</span></div><div><span>When</span><span>${fmtWhen(iso)}</span></div><div><span>Where</span><span>${esc(b.addr)}, ${esc(b.area)}</span></div>
   ${special?`<div class="total"><span>Price</span><span>Custom quote</span></div>`:`<div class="total"><span>Total</span><span>${KES(total)}</span></div><div><span>Deposit due now (50%)</span><span>${KES(dep)}</span></div><div><span>Balance after the job</span><span>${KES(total-dep)}</span></div>`}</div>
   ${special?`<div class="note">${ic('doc')}<span>No payment now. We call you with a quote before any work starts.</span></div>`:`<div class="field"><label for="bPhone">M-Pesa number</label><div class="input-ic">${ic('phone')}<input id="bPhone" data-k="bPhone" type="tel" inputmode="tel" value="${esc(fmtPhone(b.phone))}" placeholder="0712 345 678"></div></div>
   <p class="muted small">You will get an M-Pesa prompt on this number. Prototype: payment is simulated and no money moves.</p>`}
   ${b.err?`<p class="err">${esc(b.err)}</p>`:''}</div>`;
  foot=`<div class="row"><button class="btn line" data-a="bBack" style="width:auto;padding:0 22px">Back</button><button class="btn" data-a="bPay">${special?'Request quote':'Pay '+KES(dep)+' deposit'}</button></div>`;
 }
 return sheetShell(b.step===1?'Book a cleaner':b.step===2?'Choose your cleaner':'Review and pay',`${bar}${body}`,foot);
}
function bookNext(){
 const b=S.b;b.err='';
 if(b.step===1){
  const iso=whenISO(b);
  if(!b.addr.trim()){b.err='Add your estate or building and house number so the cleaner can find you.'}
  else if(!iso){b.err='Pick a date and time.'}
  else if(new Date(iso)<minTime()-6e4){b.err='Pick a time at least 2 hours from now.'}
 }
 if(!b.err)b.step++;
 setSheet(bookingView);
}
function bookPay(){
 const b=S.b;b.err='';const special=b.service==='special';
 if(!special){const p=normPhone(b.phone);if(!p){b.err='Enter a valid Safaricom number, for example 0712345678.';setSheet(bookingView);return}b.phone=p}
 const finish=()=>{
  const s=svc(b.service);const rate=b.cleaner?cl(b.cleaner).rate:500;const price=calc(b.service,b.size,rate);
  const j={id:'j'+Date.now().toString(36),service:s.name,sid:s.id,size:b.size,cid:b.cleaner||null,area:b.area,addr:`${b.addr}, ${b.area}`,notes:b.notes,when:whenISO(b),price,deposit:price/2,status:special?'quote':'searching',sample:false};
  S.jobs.unshift(j);S.user.area=b.area;S.user.addr=S.user.addr||b.addr;save();
  b.job=j.id;b.pay='done';
  if(S.sheetFn===bookingView)setSheet(bookingView);
  resolve(j);if(S.route==='jobs')render();
 };
 if(special){finish();return}
 b.pay='waiting';setSheet(bookingView);setTimeout(()=>{if(S.b===b)finish()},3200);
}
function resolve(j,delay=3500){
 if(j.status!=='searching')return;
 setTimeout(()=>{if(j.status!=='searching')return;if(!j.cid)j.cid=nearestOnline().id;j.status='accepted';save();
  toast(`${cl(j.cid).name} accepted your booking`);if(S.route==='jobs')render();if(S.sheetFn&&S.openJob===j.id)detailSheet(j.id)},delay);
}

/* ---------- support bot ---------- */
const BOT_HELLO={f:'bot',t:'👋 Hi! I’m Jemmin’s virtual assistant. How can I help you today?\nI can help with:\nBooking questions\nPayment issues\nService information\nAccount support',chips:['Book a cleaner','Prices','Payments','Gate pass']};
function botReply(t){
 t=t.toLowerCase();
 if(/gate|estate|security|access/.test(t))return {t:'A **Gate Pass** is a 6-digit code for estate security. Open **My Jobs**, tap **Gate Pass** on an active job, and share the code with the guard so your cleaner can enter.',chips:['Book a cleaner']};
 if(/pay|mpesa|m-pesa|deposit|refund|charge/.test(t))return {t:'We take a **50% deposit via M-Pesa** to secure your booking. You will get an M-Pesa prompt on your phone and enter your PIN. The balance is paid after the job.\nIf a payment fails, check your M-Pesa balance and try again.',chips:['Book a cleaner','Cancel a booking']};
 if(/cancel|reschedul|change time/.test(t))return {t:'Open **My Jobs**, tap **View Details** on the booking, then **Cancel booking**. Cancelling after a cleaner has accepted may forfeit part of the deposit.'};
 if(/price|cost|how much|rate|fee|cheap/.test(t))return {t:'Starting prices:\n**Regular Cleaning** from KES 1,500\n**Deep Cleaning** from KES 3,500\n**Laundry & Ironing** from KES 800\nCarpet or window cleaning depends on the size of the job. Specialized services get a custom quote. The final price depends on your home size and the cleaner’s hourly rate.',chips:['Book a cleaner']};
 if(/service|offer|what do you|clean|laundry|carpet|window|pest/.test(t)&&!/book|hire/.test(t))return {t:'We offer:\n**Regular Cleaning** for weekly upkeep\n**Deep Cleaning** for move-ins, move-outs and monthly refreshes\n**Laundry & Ironing**\n**Carpet or Window Cleaning**\n**Specialized Services** such as pest control and post-construction',chips:['Prices','Book a cleaner']};
 if(/account|sign|login|log in|otp|code|phone|password|profile/.test(t))return {t:'You sign in with your Kenyan phone number and a 4-digit verification code. You can update your name and address in **Profile**. If the code does not arrive, tap resend after the timer ends.'};
 if(/book|hire|cleaner|mama fua|appoint|schedule|\b(hi|hello|hey|help)\b/.test(t))return {t:'I’d be happy to help you book a verified Mama Fua. Which service are you looking for?\n**Regular Cleaning** (from KES 1,500)\n**Deep Cleaning** (from KES 3,500)\n**Laundry & Ironing** (from KES 800)\n**Carpet or Window Cleaning**\n\nA few things to keep in mind:\nPlease book at least **2 hours** in advance.\nWe require a **50% deposit** via M-Pesa to secure your booking.\nOur cleaners operate within Nairobi and are fully background-verified.',chips:['Start booking']};
 return {t:'I can help with booking, payments, services and your account. Pick a topic or type your question.',chips:['Book a cleaner','Prices','Payments','Gate pass']};
}
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
function renderBot(){
 const last=S.bot[S.bot.length-1];
 $('#bot').innerHTML=`<div class="bot-head"><span class="av">${ic('bot')}</span><div class="grow"><b>Jemmin Support</b><span>Virtual assistant</span></div><button class="iconbtn" data-a="botClose" aria-label="Minimize chat">${ic('shrink')}</button><button class="iconbtn" data-a="botReset" aria-label="Close and clear chat">${ic('close')}</button></div>
  <div class="msgs" id="botMsgs">${S.bot.map(m=>`<div class="bub ${m.f==='bot'?'them':'me'}">${m.f==='bot'?rich(m.t):esc(m.t)}</div>`).join('')}${S.typing?'<div class="bub them typing"><i></i><i></i><i></i></div>':''}
  ${last&&last.f==='bot'&&last.chips&&!S.typing?`<div class="qr">${last.chips.map(c=>`<button data-a="botChip" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}</div>
  <form class="composer" data-f="botSend"><input id="botInput" autocomplete="off" placeholder="Type your message…" aria-label="Message to support"><button aria-label="Send">${ic('send')}</button></form>`;
 const m=$('#botMsgs');m.scrollTop=m.scrollHeight;
}
function botOpen(){if(!S.bot.length)S.bot=[BOT_HELLO];S.botOpen=true;$('#botWrap').hidden=false;renderBot();setTimeout(()=>{const i=$('#botInput');i&&i.focus({preventScroll:true})},50)}
function botClose(){S.botOpen=false;$('#botWrap').hidden=true}
function botSay(text){
 text=text.trim();if(!text)return;
 if(/^start booking$/i.test(text)){botClose();startBooking();return}
 S.bot.push({f:'me',t:text});S.typing=true;renderBot();
 setTimeout(()=>{S.typing=false;S.bot.push(Object.assign({f:'bot'},botReply(text)));if(S.botOpen)renderBot()},650);
}

/* ---------- chat threads ---------- */
const AUTO=['Okay, noted. See you then.','Thank you! I will bring my own supplies.','Sure, I can do that.','On my way soon, will message you when I am at the gate.'];
function threadSend(txt){
 txt=txt.trim();if(!txt||!S.thread)return;const id=S.thread;
 (S.threads[id]=S.threads[id]||[]).push({f:'me',t:txt});S.typing=true;save();render();scrollMsgs();
 setTimeout(()=>{S.typing=false;S.threads[id].push({f:'them',t:AUTO[Math.floor(Math.random()*AUTO.length)]});save();if(S.route==='thread'&&S.thread===id){render();scrollMsgs()}},1400);
}
function scrollMsgs(){const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;const i=$('#threadInput');if(i)i.focus({preventScroll:true})}

/* ---------- auth ---------- */
let cdTimer=null;
function startCountdown(){
 clearInterval(cdTimer);let n=30;const el=()=>$('#resend');
 const tick=()=>{const e=el();if(!e){clearInterval(cdTimer);return}
  e.innerHTML=n>0?`Resend code in ${n}s`:`<button class="link" style="display:inline;padding:0" data-a="resend">Resend code</button>`;if(n<=0)clearInterval(cdTimer);n--};
 tick();cdTimer=setInterval(tick,1000);
}

/* ---------- events ---------- */
const A={
 tab:d=>nav(d.v),
 go:d=>nav(d.v),
 back:()=>back(),
 pkgGo:d=>{S.openPkg=d.v;nav('packages')},
 pkgToggle:d=>{S.openPkg=S.openPkg===d.v?null:d.v;render()},
 book:d=>{if(S.sheet&&!S.b)closeSheet();startBooking({service:d.s,cleaner:d.c})},
 cleanerOpen:d=>cleanerSheet(d.v),
 sheetClose:()=>closeSheet(),
 filter:d=>{S.filter=d.v;render()},
 onlineToggle:()=>{S.online=!S.online;render()},
 jobTab:d=>{S.jobTab=d.v;render()},
 noteHide:()=>{S.sampleNote=false;save();render()},
 details:d=>{S.openJob=d.v;S.cancelAsk=null;detailSheet(d.v)},
 viewJob:d=>{closeSheet();S.jobTab='active';nav('jobs');S.openJob=d.v;detailSheet(d.v)},
 gate:d=>gateSheet(d.v),
 copy:d=>{const done=()=>toast('Code copied');try{navigator.clipboard.writeText(d.v).then(done,()=>toast('Code: '+d.v))}catch(e){toast('Code: '+d.v)}},
 cancelAsk:d=>{S.cancelAsk=d.v;detailSheet(d.v)},
 cancelNo:()=>{const id=S.cancelAsk;S.cancelAsk=null;detailSheet(id)},
 cancelYes:d=>{const j=S.jobs.find(x=>x.id===d.v);j.status='cancelled';S.cancelAsk=null;save();detailSheet(j.id);render();toast('Booking cancelled')},
 advance:d=>{const j=S.jobs.find(x=>x.id===d.v);const i=FLOW.indexOf(j.status);if(i<FLOW.length-1){if(j.status==='searching'&&!j.cid)j.cid=nearestOnline().id;j.status=FLOW[i+1];save();detailSheet(j.id);render()}},
 rate:d=>{const j=S.jobs.find(x=>x.id===d.v);j.rating=+d.n;save();detailSheet(j.id);toast('Thanks for rating')},
 tTab:d=>{S.tTab=d.v;render()},
 thread:d=>{closeSheet();S.thread=d.v;S.typing=false;nav('thread');scrollMsgs()},
 botOpen:()=>botOpen(),botClose:()=>botClose(),
 botReset:()=>{S.bot=[];S.typing=false;botClose()},
 botChip:d=>botSay(d.v),
 bSvc:d=>{S.b.service=d.v;S.b.err='';setSheet(bookingView)},
 bSize:d=>{S.b.size=d.v;setSheet(bookingView)},
 bWhen:d=>{S.b.when=d.v;S.b.err='';setSheet(bookingView)},
 bClean:d=>{S.b.cleaner=d.v||null;setSheet(bookingView)},
 bNext:()=>bookNext(),
 bBack:()=>{S.b.step--;S.b.err='';setSheet(bookingView)},
 bPay:()=>bookPay(),
 signout:()=>{S.user=null;save();S.stack=[];nav('home');toast('Signed out')},
 resetDemo:()=>{seed();S.sampleNote=true;save();toast('Sample jobs reloaded')},
 sendCode:()=>{const p=normPhone($('#phone').value);const e=$('#phoneErr');
  if(!p){e.textContent='Enter a valid Kenyan number, for example 0712345678.';e.hidden=false;return}
  S.otpPhone=p;nav('otp')},
 resend:()=>{toast('Code sent again');startCountdown()},
 verify:()=>{const v=$('#otp').value.trim();const e=$('#otpErr');
  if(!/^\d{4}$/.test(v)){e.textContent='Enter the 4-digit code.';e.hidden=false;return}
  const first=!S.user;S.user=S.user||{phone:S.otpPhone,name:'',area:'Westlands',addr:''};S.user.phone=S.otpPhone;
  if(!S.jobs.length&&!Object.keys(S.threads).length)seed();
  save();S.stack=[];const to=S.after;const pend=S.pending;S.after=null;S.pending=null;
  nav(to&&to!=='signin'?to:'home');toast('Signed in');
  if(pend)setTimeout(()=>startBooking(pend),250);}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 if(t.classList.contains('off')&&!t.id)return;
 const f=A[t.dataset.a];if(f){e.preventDefault();f(t.dataset,t)}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.matches('[role="button"][data-a]')){e.preventDefault();e.target.click();return}
 if(e.key==='Enter'&&e.target.id==='homeSearch'){S.q=e.target.value;S.filter='All';nav('find');return}
 if(e.key==='Enter'&&e.target.id==='phone'){A.sendCode();return}
 if(e.key==='Enter'&&e.target.id==='otp'){A.verify();return}
 if(e.key==='Escape'){if(S.botOpen)botClose();else if(S.sheet)closeSheet()}
});
document.addEventListener('input',e=>{
 const k=e.target.dataset.k;if(!k)return;const v=e.target.value;
 if(k==='findSearch'){S.q=v;$('#findList').innerHTML=findList()}
 else if(k==='phone'){const ok=!!normPhone(v);const b=$('#sendCode');b.classList.toggle('off',!ok);$('#phoneErr').hidden=true}
 else if(k==='otp'){e.target.value=v.replace(/\D/g,'').slice(0,4);$('#verify').classList.toggle('off',e.target.value.length!==4);$('#otpErr').hidden=true}
 else if(k==='pName'){S.user.name=v;save()}
 else if(k==='pAddr'){S.user.addr=v;save()}
 else if(k==='bAddr'){S.b.addr=v}
 else if(k==='bNotes'){S.b.notes=v}
 else if(k==='bPhone'){S.b.phone=v}
});
document.addEventListener('change',e=>{
 const k=e.target.dataset.k;if(!k)return;const v=e.target.value;
 if(k==='pArea'){S.user.area=v;save()}
 else if(k==='bArea'){S.b.area=v}
 else if(k==='bCustom'){S.b.custom=v;setSheet(bookingView)}
});
document.addEventListener('submit',e=>{
 const f=e.target.dataset.f;if(!f)return;e.preventDefault();
 const inp=e.target.querySelector('input');const v=inp.value;inp.value='';
 if(f==='botSend')botSay(v);else if(f==='threadSend')threadSend(v);
});

/* ---------- boot ---------- */
load();
S.jobs.filter(j=>j.status==='searching').forEach(j=>resolve(j,800));
render();
})();
</script>

</body>
</html>
